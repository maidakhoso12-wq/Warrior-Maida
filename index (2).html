<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#0a2a6b;font-family:"Trebuchet MS",system-ui,sans-serif}
#app{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block}
.hidden{display:none!important}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:12px;align-items:center;color:#fff;font-weight:800;font-size:clamp(14px,3.5vw,20px);text-shadow:0 2px 0 #0b3d91;pointer-events:none}
.hbar{width:30%;max-width:200px;height:16px;background:#0b3d91;border:3px solid #fff;border-radius:10px;overflow:hidden}
#hp{height:100%;width:100%;background:linear-gradient(#ff7a9a,#ff3d6e);transition:width .2s}
#score{margin-left:auto}
#muteBtn{pointer-events:auto;background:#ffffff33;border:0;border-radius:50%;width:38px;height:38px;font-size:18px}
#controls{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));padding:0 14px;display:flex;justify-content:space-between}
.pad{display:flex;gap:14px}
.pad button{width:clamp(62px,17vw,84px);height:clamp(62px,17vw,84px);border-radius:50%;border:4px solid #fff;font-size:28px;color:#fff;background:radial-gradient(circle at 30% 25%,#7fd0ff,#1e78e6);box-shadow:0 5px 0 #0b3d91;opacity:.88}
.pad button:active,.pad button.on{transform:translateY(4px);box-shadow:0 1px 0 #0b3d91}
#bShoot{background:radial-gradient(circle at 30% 25%,#ffe27a,#ffa400)!important;box-shadow:0 5px 0 #a65f00!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 30%,#3cb4ff,#0a4fc4);color:#fff;text-align:center;padding:16px}
.logo{width:min(78vw,52vh,420px);border-radius:28px;border:5px solid #fff;box-shadow:0 10px 30px #0006}
.big{font:900 clamp(22px,6vw,32px) "Trebuchet MS",sans-serif;color:#5a3a00;background:linear-gradient(#ffe980,#ffb400);border:4px solid #fff;border-radius:40px;padding:12px 44px;box-shadow:0 6px 0 #a65f00}
.big.alt{background:linear-gradient(#bfe6ff,#6cb8ff);color:#0b3d91;box-shadow:0 6px 0 #0b3d91;font-size:20px;padding:8px 34px}
.big:active{transform:translateY(4px)}
h1{font-size:clamp(36px,10vw,64px);margin:0;text-shadow:0 4px 0 #0b3d91}
.tip{font-size:14px;opacity:.9}
</style>
</head>

<script>// Procedural audio (no files needed): music loop + sound effects via WebAudio
const Sound=(()=>{
  let ctx,master,muted=false,musicOn=false,step=0,timer;
  const notes=[523,659,784,659,587,740,880,740,494,622,740,622,440,554,659,554]; // gentle fantasy arpeggio
  function init(){ if(ctx)return; ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination); }
  function tone(f,d,type='square',vol=.15,slide=0){
    if(!ctx||muted)return; const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d);
  }
  return {
    resume(){init(); if(ctx.state==='suspended')ctx.resume();},
    shoot(){tone(900,.12,'square',.1,-600)},
    hit(){tone(200,.1,'sawtooth',.12,-100)},
    coin(){tone(988,.08,'triangle',.15);setTimeout(()=>tone(1319,.12,'triangle',.15),70)},
    jump(){tone(300,.15,'sine',.15,400)},
    hurt(){tone(150,.3,'sawtooth',.2,-90)},
    win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.18),i*120))},
    startMusic(){ init(); if(musicOn)return; musicOn=true;
      timer=setInterval(()=>{ const n=notes[step%16]; tone(n,.28,'triangle',.07); if(step%4===0)tone(n/4,.5,'sine',.1); step++; },230); },
    stopMusic(){musicOn=false;clearInterval(timer)},
    toggle(){muted=!muted;return muted}
  };
})();
</script>
<script>(()=>{
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');
const H=360; let W=640,S=1,GY=H-100; // logical size, ground y
function resize(){const a=innerWidth/innerHeight;W=Math.max(480,Math.min(900,H*a));S=innerHeight/H;
  const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d*innerWidth/W,0,0,d*innerHeight/H,0,0);GY=H-100;}
addEventListener('resize',resize);resize();

// ---------- state ----------
const keys={left:0,right:0,jump:0,shoot:0};
let st='menu',P,bullets,enemies,coinsA,parts,eBul,stars=[],clouds=[];
let level=1,wave=0,wavesInLevel=3,score=0,coins=0,spawnQ=0,spawnT=0,msg='',msgT=0,t=0,shake=0;
for(let i=0;i<60;i++)stars.push({x:Math.random()*900,y:Math.random()*GY,r:Math.random()*1.6+.4,p:Math.random()*6});
for(let i=0;i<6;i++)clouds.push({x:Math.random()*900,y:30+Math.random()*120,s:.5+Math.random()});

const THEMES=[ // blue fantasy backgrounds per level
 {sky:['#5fc8ff','#1e78e6'],ground:'#2b6fd6',top:'#7fe0ff',name:'Crystal Meadow'},
 {sky:['#3a7bd5','#1b2a7a'],ground:'#2a3f9e',top:'#8aa8ff',name:'Twilight Forest'},
 {sky:['#1b2a7a','#0a0f3d'],ground:'#1d2a73',top:'#b58cff',name:'Starlit Castle'},
 {sky:['#4ee1d6','#1a6fb5'],ground:'#1f7fa8',top:'#a5fff4',name:'Frozen Lagoon'}];
const theme=()=>THEMES[(level-1)%THEMES.length];

const platforms=()=>[{x:W*.18,y:GY-80,w:110},{x:W*.62,y:GY-80,w:110},{x:W*.4,y:GY-140,w:100}];

function newGame(){
  level=1;score=0;coins=0;startLevel(true);
  P={x:W/2,y:GY-40,vx:0,vy:0,w:26,h:40,hp:100,max:100,face:1,cd:0,inv:0,ground:false,anim:0};
}
function startLevel(first){wave=0;wavesInLevel=2+Math.min(level,4);bullets=[];enemies=[];coinsA=[];parts=[];eBul=[];
  if(P){P.hp=Math.min(P.max,P.hp+30);P.x=W/2;}
  banner(`Level ${level}: ${theme().name}`);nextWave();}
function banner(m){msg=m;msgT=2.2;}
function nextWave(){wave++;
  if(wave>wavesInLevel){ // level complete
    Sound.win();level++;if(level>8){end(true);return;}startLevel();return;}
  const boss=wave===wavesInLevel&&level%2===0;
  spawnQ=boss?1:3+level+wave;spawnT=0;
  if(boss)bossFlag=true;
  banner(boss?'BOSS!':`Wave ${wave}/${wavesInLevel}`);}
let bossFlag=false;

function spawn(){
  const side=Math.random()<.5?-1:1,x=side<0?-30:W+30;
  if(bossFlag){bossFlag=false;enemies.push({t:'boss',x,y:GY-60,vx:0,vy:0,w:70,h:70,hp:25+level*8,max:25+level*8,d:side*-1,cd:2,ph:0,val:30});return;}
  const r=Math.random(),lv=level;
  if(r<.45||lv<2)enemies.push({t:'slime',x,y:GY-24,vx:0,vy:0,w:30,h:24,hp:2+lv*.6|0,d:-side,sp:40+lv*6+Math.random()*20,ph:Math.random()*6,val:5});
  else if(r<.78)enemies.push({t:'bat',x,y:40+Math.random()*90,vx:0,vy:0,w:30,h:20,hp:1+(lv/3|0),d:-side,sp:60+lv*7,ph:Math.random()*6,val:8});
  else enemies.push({t:'brute',x,y:GY-40,vx:0,vy:0,w:38,h:40,hp:6+lv,d:-side,sp:30+lv*3,cd:2,ph:0,val:15});
}

// ---------- update ----------
function update(dt){
  t+=dt;if(msgT>0)msgT-=dt;if(shake>0)shake-=dt*30;
  // player
  const sp=170;P.vx=(keys.right-keys.left)*sp;if(P.vx)P.face=Math.sign(P.vx);
  if(keys.jump&&P.ground){P.vy=-420;P.ground=false;Sound.jump();}
  P.vy+=1100*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;P.x=Math.max(14,Math.min(W-14,P.x));
  P.ground=false;
  if(P.y>=GY-P.h/2){P.y=GY-P.h/2;P.vy=0;P.ground=true;}
  for(const p of platforms()){ // one-way platforms
    if(P.vy>=0&&P.x>p.x-8&&P.x<p.x+p.w+8&&P.y+P.h/2>=p.y&&P.y+P.h/2-P.vy*dt<=p.y+4){P.y=p.y-P.h/2;P.vy=0;P.ground=true;}}
  P.cd-=dt;P.inv-=dt;P.anim+=dt*(P.vx?10:3);
  if(keys.shoot&&P.cd<=0){P.cd=.22-Math.min(.08,level*.01);Sound.shoot();
    const n=level>=4?3:level>=2?2:1; // upgraded star-shot spread
    for(let i=0;i<n;i++)bullets.push({x:P.x+P.face*18,y:P.y-4+(i-(n-1)/2)*8,vx:P.face*420,vy:0,life:1.2,r:6});}
  for(const b of bullets){b.x+=b.vx*dt;b.life-=dt;b.rot=(b.rot||0)+dt*12;}
  bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20);
  // spawning
  if(spawnQ>0){spawnT-=dt;if(spawnT<=0){spawn();spawnQ--;spawnT=Math.max(.5,1.6-level*.1);}}
  // enemies
  for(const e of enemies){
    e.ph+=dt;
    const dir=Math.sign(P.x-e.x)||1;
    if(e.t==='slime'){e.x+=e.d*e.sp*dt;if(e.x<20)e.d=1;if(e.x>W-20)e.d=-1;e.y=GY-12-Math.abs(Math.sin(e.ph*5))*10;}
    else if(e.t==='bat'){e.x+=dir*e.sp*dt*.8;e.y+=(P.y-e.y)*dt*.6+Math.sin(e.ph*6)*30*dt;}
    else if(e.t==='brute'){e.x+=dir*e.sp*dt;e.cd-=dt;if(e.cd<=0){e.cd=2.2;eBul.push({x:e.x,y:e.y-4,vx:dir*160,vy:0,life:3,r:6});}}
    else if(e.t==='boss'){e.x+=dir*35*dt;e.y=GY-40-Math.abs(Math.sin(e.ph*2))*30;e.cd-=dt;
      if(e.cd<=0){e.cd=1.4;for(let a=-1;a<=1;a++)eBul.push({x:e.x,y:e.y,vx:dir*150,vy:a*60,life:4,r:7});}}
    // bullet hits
    for(const b of bullets){if(b.life>0&&Math.abs(b.x-e.x)<e.w/2+b.r&&Math.abs(b.y-e.y)<e.h/2+b.r){
      b.life=0;e.hp--;e.flash=.1;Sound.hit();burst(b.x,b.y,'#fff',4);}}
    if(e.flash>0)e.flash-=dt;
    // touch player
    if(P.inv<=0&&Math.abs(P.x-e.x)<(P.w+e.w)/2-4&&Math.abs(P.y-e.y)<(P.h+e.h)/2-4)hurt(e.t==='boss'?25:12);
    if(e.hp<=0){e.dead=1;score+=e.val*10;burst(e.x,e.y,'#ffd84a',14);
      const n=e.t==='boss'?10:1+(Math.random()<.4?1:0);for(let i=0;i<n;i++)coinsA.push({x:e.x,y:e.y,vx:(Math.random()-.5)*140,vy:-200-Math.random()*100});}
  }
  enemies=enemies.filter(e=>!e.dead);
  for(const b of eBul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(P.inv<=0&&Math.hypot(b.x-P.x,b.y-P.y)<b.r+14){b.life=0;hurt(10);}}
  eBul=eBul.filter(b=>b.life>0);
  for(const c of coinsA){c.vy+=700*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=.98;if(c.y>GY-8){c.y=GY-8;c.vy*=-.4;c.vx*=.7;}
    if(Math.hypot(c.x-P.x,c.y-P.y)<24){c.got=1;coins++;score+=10;Sound.coin();}}
  coinsA=coinsA.filter(c=>!c.got);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  if(spawnQ<=0&&!enemies.length&&st==='play'){nextWave();}
  updateHUD();
}
function hurt(d){P.hp-=d;P.inv=1;shake=6;Sound.hurt();burst(P.x,P.y,'#ff6b8a',10);if(P.hp<=0){P.hp=0;end(false);}}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*220,vy:-Math.random()*160,life:.5+Math.random()*.4,c});}
function updateHUD(){$('hp').style.width=P.hp/P.max*100+'%';$('score').textContent=score;$('coins').textContent='🪙 '+coins;$('lvl').textContent='Lv '+level;}
function end(win){st='over';Sound.stopMusic();
  $('overTitle').textContent=win?'YOU WIN! 🎉':'GAME OVER';
  $('overStats').innerHTML=`Score: <b>${score}</b> · Coins: <b>${coins}</b> · Level: <b>${Math.min(level,8)}</b><br>Best: <b>${saveBest()}</b>`;
  $('over').classList.remove('hidden');$('hud').classList.add('hidden');$('controls').classList.add('hidden');}
function saveBest(){let b=0;try{b=+localStorage.wmBest||0;if(score>b){b=score;localStorage.wmBest=b;}}catch(e){b=Math.max(b,score)}return b;}

// ---------- draw ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function drawBG(){
  const th=theme(),g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=.5+.5*Math.sin(t*2+s.p);ctx.fillStyle='#fff';ctx.fillRect(s.x%W,s.y,s.r,s.r);}
  ctx.globalAlpha=1;
  for(const c of clouds){c.x-=c.s*.15;if(c.x<-80)c.x=W+80;ctx.fillStyle='#ffffff55';
    ctx.beginPath();ctx.arc(c.x,c.y,18*c.s,0,7);ctx.arc(c.x+20*c.s,c.y+4,22*c.s,0,7);ctx.arc(c.x+42*c.s,c.y,16*c.s,0,7);ctx.fill();}
  // distant crystal hills
  ctx.fillStyle='#ffffff22';for(let i=0;i<8;i++){const x=i*W/7;ctx.beginPath();ctx.moveTo(x-50,GY);ctx.lineTo(x,GY-70-(i%3)*25);ctx.lineTo(x+50,GY);ctx.fill();}
  ctx.fillStyle=th.ground;ctx.fillRect(0,GY,W,H-GY);ctx.fillStyle=th.top;ctx.fillRect(0,GY,W,6);
  for(const p of platforms()){ctx.fillStyle=th.ground;rr(p.x,p.y,p.w,12,6);ctx.fill();ctx.fillStyle=th.top;rr(p.x,p.y,p.w,5,3);ctx.fill();}
}
function star(x,y,r,rot,c){ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rad=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();ctx.fill();}
function drawMaida(){
  const {x,y,face:f}=P;if(P.inv>0&&Math.floor(t*20)%2)return;
  const bob=P.ground&&P.vx?Math.sin(P.anim)*2:0,leg=P.ground&&P.vx?Math.sin(P.anim)*5:0;
  ctx.save();ctx.translate(x,y+bob);ctx.scale(f,1);
  ctx.fillStyle='#8fc3ff';rr(-8+leg,10,7,10,3);ctx.fill();rr(1-leg,10,7,10,3);ctx.fill(); // legs
  ctx.fillStyle='#bfe0ff';ctx.beginPath();ctx.moveTo(-12,-2);ctx.lineTo(-20,16);ctx.lineTo(-4,14);ctx.fill(); // cape
  ctx.fillStyle='#a9d4ff';rr(-10,-4,20,20,6);ctx.fill();ctx.fillStyle='#fff8';ctx.fillRect(-1,-3,2,10); // tunic
  ctx.fillStyle='#6aa8ff';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(-9,6,8,0,7);ctx.fill();ctx.stroke();star(-9,6,5,0,'#cfe8ff'); // shield
  ctx.fillStyle='#f9d5b8';ctx.beginPath();ctx.arc(0,-14,13,0,7);ctx.fill(); // head
  ctx.fillStyle='#6b3f26';ctx.beginPath();ctx.arc(0,-17,14,Math.PI,0);ctx.fill();ctx.beginPath();ctx.arc(-15,-14,6,0,7);ctx.arc(15,-14,6,0,7);ctx.fill(); // hair+pigtails
  ctx.fillStyle='#7fc4ff';ctx.fillRect(-18,-24,7,5);ctx.fillRect(11,-24,7,5); // bows
  ctx.fillStyle='#3b2312';ctx.beginPath();ctx.ellipse(4,-13,3,4,0,0,7);ctx.ellipse(-4,-13,3,4,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(4,-15,1.5,1.5);ctx.fillRect(-3,-15,1.5,1.5);
  ctx.fillStyle='#ff7b8e';ctx.beginPath();ctx.arc(1,-7,2.5,0,Math.PI);ctx.fill();
  ctx.save();ctx.translate(12,4);ctx.rotate(P.cd>.1?-.9:-.3);ctx.fillStyle='#5aa6ff';ctx.fillRect(0,-3,18,6);ctx.fillStyle='#ffd84a';ctx.fillRect(-2,-5,3,10);ctx.restore(); // sword
  ctx.restore();
}
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);if(e.flash>0)ctx.filter='brightness(2.5)';
  const w=e.w,h=e.h,eyes=(dx)=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6+dx,-2,4,0,7);ctx.arc(6+dx,-2,4,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-5+dx,-2,2,0,7);ctx.arc(7+dx,-2,2,0,7);ctx.fill();};
  if(e.t==='slime'){ctx.fillStyle='#8b5cf6';ctx.beginPath();ctx.ellipse(0,2,w/2,h/2,0,Math.PI,0);ctx.rect(-w/2,2,w,h/2-2);ctx.fill();eyes(0);}
  else if(e.t==='bat'){const fl=Math.sin(e.ph*14)*8;ctx.fillStyle='#4b2a8a';ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-24,-8+fl);ctx.lineTo(-14,6);ctx.moveTo(6,0);ctx.lineTo(24,-8+fl);ctx.lineTo(14,6);ctx.fill();ctx.fillStyle='#7c4dff';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();eyes(0);}
  else if(e.t==='brute'){ctx.fillStyle='#e0527a';rr(-w/2,-h/2,w,h,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-8,6,16,5);eyes(0);ctx.fillStyle='#ffd84a';ctx.fillRect(-12,-h/2-5,5,8);ctx.fillRect(7,-h/2-5,5,8);}
  else{ctx.fillStyle='#d13b8f';ctx.beginPath();ctx.arc(0,0,w/2,0,7);ctx.fill();ctx.fillStyle='#ffd84a';for(let i=-2;i<=2;i++)ctx.fillRect(i*12-3,-w/2-8,6,12);
    ctx.scale(2,2);eyes(0);ctx.scale(.5,.5);ctx.fillStyle='#fff';ctx.fillRect(-18,12,36,6);
    ctx.fillStyle='#400';ctx.fillRect(-w/2,-w/2-18,w,6);ctx.fillStyle='#ff4d6d';ctx.fillRect(-w/2,-w/2-18,w*e.hp/e.max,6);}
  ctx.restore();
}
function draw(){
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBG();
  if(st!=='menu'){
    for(const c of coinsA){ctx.fillStyle='#ffd84a';ctx.strokeStyle='#b8860b';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(c.x,c.y,Math.abs(Math.cos(t*6+c.x))*6+1,6,0,0,7);ctx.fill();ctx.stroke();}
    enemies.forEach(drawEnemy);
    for(const b of bullets){ctx.shadowColor='#fff27a';ctx.shadowBlur=10;star(b.x,b.y,b.r,b.rot,'#ffe85a');ctx.shadowBlur=0;}
    for(const b of eBul){ctx.fillStyle='#ff4d8a';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();}
    if(st==='play')drawMaida();
    for(const p of parts){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3);}ctx.globalAlpha=1;
    if(msgT>0){ctx.globalAlpha=Math.min(1,msgT);ctx.font='900 28px Trebuchet MS';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#0b3d91';ctx.strokeText(msg,W/2,90);ctx.fillStyle='#ffe85a';ctx.fillText(msg,W/2,90);ctx.globalAlpha=1;}
  }
  ctx.restore();
}

// ---------- loop ----------
let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(st==='play')update(dt);else t+=dt;draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

// ---------- input ----------
function hold(id,k){const b=$(id);
  const on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on');Sound.resume();},off=e=>{e.preventDefault();keys[k]=0;b.classList.remove('on');};
  b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false});
  b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);}
hold('bLeft','left');hold('bRight','right');hold('bJump','jump');hold('bShoot','shoot');
const kmap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'jump',w:'jump',' ':'shoot',j:'shoot'};
addEventListener('keydown',e=>{const k=kmap[e.key];if(k){keys[k]=1;e.preventDefault();}});
addEventListener('keyup',e=>{const k=kmap[e.key];if(k)keys[k]=0;});
addEventListener('contextmenu',e=>e.preventDefault());

function play(){Sound.resume();Sound.startMusic();newGame();st='play';
  ['menu','over'].forEach(i=>$(i).classList.add('hidden'));$('hud').classList.remove('hidden');$('controls').classList.remove('hidden');
  Object.keys(keys).forEach(k=>keys[k]=0);}
$('startBtn').onclick=play;$('restartBtn').onclick=play;
$('menuBtn').onclick=()=>{st='menu';$('over').classList.add('hidden');$('menu').classList.remove('hidden');};
$('muteBtn').onclick=()=>{$('muteBtn').textContent=Sound.toggle()?'🔇':'🔊';};
document.addEventListener('visibilitychange',()=>{if(document.hidden)Object.keys(keys).forEach(k=>keys[k]=0);});
})();
</script>
</body>
